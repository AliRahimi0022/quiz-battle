{% extends "base.html" %}
{% block title %}Quiz Club / Join match{% endblock %}
{% block content %}
<section class="rise mx-auto max-w-xl py-6" aria-labelledby="join-title">
  <p class="font-mono text-[11px] uppercase tracking-[.2em] text-lime">You have an invite</p>
  <h1 id="join-title" class="mt-4 text-4xl font-extrabold leading-tight sm:text-5xl">Join the match.</h1>
  <p class="mt-4 text-sm leading-6 text-muted">Enter your own name to join this room. You’ll be able to ready up when you arrive.</p>
  {% if error %}<p class="mt-5 border-l-2 border-coral bg-coral/10 px-4 py-3 text-sm" role="alert">{{ error }}</p>{% endif %}
  <form action="{{ url_for('join_game', match_code=match_code) }}" method="post" class="mt-8">
    <label class="block max-w-sm text-xs font-bold uppercase tracking-wider text-muted">Your name
      <input name="player_name" maxlength="24" required autocomplete="off" autofocus placeholder="Name" class="mt-2 w-full rounded-md border border-line bg-panel px-4 py-3.5 text-sm text-paper outline-none transition focus:border-lime" />
    </label>
    <button class="group mt-5 flex w-full items-center justify-between rounded-md bg-lime px-5 py-4 text-left font-extrabold text-ink transition hover:bg-paper sm:w-auto sm:min-w-56" type="submit">
      <span>Join room</span><span class="text-lg transition-transform group-hover:translate-x-1" aria-hidden="true">&#8594;</span>
    </button>
  </form>
</section>
{% endblock %}
